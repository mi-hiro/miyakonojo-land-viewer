<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7fafc">
    <title>都城市 売土地ビューア</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div id="appShell" class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">都城市 売土地</p>
          <h1>物件ビューア</h1>
        </div>
        <div class="topbar-actions">
          <div id="deviceModeControl" class="device-mode" aria-label="表示サイズ切替">
            <button class="device-mode-button" type="button" data-device-mode="desktop" aria-pressed="false">
              <i data-lucide="monitor"></i><span>PC</span>
            </button>
            <button class="device-mode-button" type="button" data-device-mode="tablet" aria-pressed="false">
              <i data-lucide="tablet"></i><span>タブレット</span>
            </button>
            <button class="device-mode-button" type="button" data-device-mode="mobile" aria-pressed="false">
              <i data-lucide="smartphone"></i><span>スマホ</span>
            </button>
          </div>
          <button id="refreshButton" class="icon-button" type="button" aria-label="更新">
            <i data-lucide="refresh-cw"></i>
          </button>
        </div>
      </header>

      <main class="workspace">
        <section class="summary-band" aria-label="集計">
          <div class="summary-item">
            <span class="summary-label">掲載</span>
            <strong id="listingCount">-</strong>
          </div>
          <div class="summary-item">
            <span class="summary-label">現在平均</span>
            <strong id="currentAverage">-</strong>
          </div>
          <div class="summary-item">
            <span class="summary-label">履歴平均</span>
            <strong id="historyAverage">-</strong>
          </div>
          <div class="summary-item">
            <span class="summary-label">更新</span>
            <strong id="updatedAt">-</strong>
          </div>
        </section>

        <section class="controls" aria-label="絞り込み">
          <label class="search-box">
            <i data-lucide="search"></i>
            <input id="searchInput" type="search" placeholder="町名・所在地・備考で検索">
          </label>

          <div class="control-row">
            <label class="select-wrap">
              <span>並び替え</span>
              <select id="sortSelect">
                <option value="new">新着順</option>
                <option value="priceAsc">金額が安い順</option>
                <option value="priceDesc">金額が高い順</option>
                <option value="areaDesc">面積が広い順</option>
                <option value="areaAsc">面積が狭い順</option>
                <option value="unitAsc">坪単価が安い順</option>
                <option value="unitDesc">坪単価が高い順</option>
              </select>
            </label>
            <label class="select-wrap">
              <span>町名</span>
              <select id="townFilter">
                <option value="">すべて</option>
              </select>
            </label>
            <label class="select-wrap">
              <span>学校区</span>
              <select id="schoolFilter">
                <option value="">すべて</option>
              </select>
            </label>
            <div class="toggle-row">
              <label class="check-pill"><input id="favoriteOnly" type="checkbox">お気に入り</label>
              <label class="check-pill"><input id="candidateOnly" type="checkbox">買付候補</label>
              <label class="check-pill"><input id="newOnly" type="checkbox">新着</label>
              <label class="check-pill"><input id="cheapOnly" type="checkbox">割安新着</label>
              <label class="check-pill"><input id="mappedOnly" type="checkbox">地図表示</label>
              <label class="check-pill"><input id="showExcluded" type="checkbox">除外表示</label>
            </div>
          </div>

          <div class="range-filters" aria-label="価格と面積の範囲">
            <div class="range-group">
              <span class="range-title">価格（万円）</span>
              <label><input id="priceMin" type="number" inputmode="numeric" min="0" step="10" placeholder="下限"></label>
              <span class="range-separator">〜</span>
              <label><input id="priceMax" type="number" inputmode="numeric" min="0" step="10" placeholder="上限"></label>
            </div>
            <div class="range-group">
              <span class="range-title">面積（坪）</span>
              <label><input id="areaMin" type="number" inputmode="decimal" min="0" step="1" placeholder="下限"></label>
              <span class="range-separator">〜</span>
              <label><input id="areaMax" type="number" inputmode="decimal" min="0" step="1" placeholder="上限"></label>
            </div>
          </div>

          <div class="backup-row" aria-label="保存データのバックアップ">
            <div class="backup-status">
              <span>保存データ</span>
              <strong id="backupSummary">-</strong>
            </div>
            <div class="backup-actions">
              <button id="exportBackupButton" class="utility-button" type="button">
                <i data-lucide="download"></i><span>バックアップ保存</span>
              </button>
              <button id="importBackupButton" class="utility-button" type="button">
                <i data-lucide="upload"></i><span>復元</span>
              </button>
              <input id="backupFileInput" type="file" accept="application/json,.json" hidden>
            </div>
          </div>

          <nav class="tabs" aria-label="表示切替">
            <button class="tab active" type="button" data-view="list">
              <i data-lucide="list"></i><span>一覧</span>
            </button>
            <button class="tab" type="button" data-view="dashboard">
              <i data-lucide="layout-dashboard"></i><span>AI分析</span>
            </button>
            <button class="tab" type="button" data-view="map">
              <i data-lucide="map"></i><span>地図</span>
            </button>
            <button class="tab" type="button" data-view="history">
              <i data-lucide="chart-no-axes-combined"></i><span>町別</span>
            </button>
            <button class="tab" type="button" data-view="distribution">
              <i data-lucide="bar-chart-3"></i><span>分布</span>
            </button>
            <button class="tab" type="button" data-view="compare">
              <i data-lucide="table-2"></i><span>比較</span>
            </button>
          </nav>
        </section>

        <section id="statusMessage" class="status-message" hidden></section>

        <section id="detailView" class="content-view detail-page-view" aria-label="物件詳細">
          <div class="detail-page-head">
            <a id="detailBackLink" class="detail-back-link" href="#list" aria-label="一覧へ戻る">
              <i data-lucide="arrow-left"></i><span>一覧へ戻る</span>
            </a>
            <div>
              <p id="detailPageTown" class="eyebrow"></p>
              <h2 id="detailPageTitle"></h2>
            </div>
          </div>
          <div id="detailPageBody" class="detail-body"></div>
        </section>

        <section id="dashboardView" class="content-view" aria-label="AI分析">
          <div class="dashboard-grid">
            <section class="dashboard-panel dashboard-panel-wide">
              <div class="dashboard-panel-head">
                <div>
                  <span class="dashboard-kicker">School Zone Signal</span>
                  <h2>学校区別 平均坪単価</h2>
                </div>
                <span id="schoolAverageSummary" class="dashboard-summary">-</span>
              </div>
              <div id="schoolAverageGrid" class="school-average-grid"></div>
            </section>

            <section class="dashboard-panel">
              <div class="dashboard-panel-head">
                <div>
                  <span class="dashboard-kicker">Market Pulse</span>
                  <h2>最近の動き</h2>
                </div>
              </div>
              <div id="recentMovementGrid" class="dashboard-stat-list"></div>
            </section>

            <section class="dashboard-panel">
              <div class="dashboard-panel-head">
                <div>
                  <span class="dashboard-kicker">Risk Watch</span>
                  <h2>注意アラート</h2>
                </div>
              </div>
              <div id="alertGrid" class="dashboard-alert-list"></div>
            </section>

            <section class="dashboard-panel">
              <div class="dashboard-panel-head">
                <div>
                  <span class="dashboard-kicker">Data Sources</span>
                  <h2>情報元の取得状況</h2>
                </div>
              </div>
              <div id="dataSourceGrid" class="source-status-list"></div>
            </section>
          </div>
        </section>

        <section id="listView" class="content-view active" aria-label="物件一覧">
          <div class="result-meta">
            <div class="result-counts">
              <span id="resultCount">-</span>
              <span id="mapReadyCount">-</span>
            </div>
            <div id="listLayoutControl" class="view-mode" aria-label="一覧表示方法">
              <button class="view-mode-button active" type="button" data-list-layout="cards" aria-pressed="true">
                <i data-lucide="layout-grid"></i><span>カード</span>
              </button>
              <button class="view-mode-button" type="button" data-list-layout="compact" aria-pressed="false">
                <i data-lucide="rows-3"></i><span>コンパクト</span>
              </button>
              <button class="view-mode-button" type="button" data-list-layout="table" aria-pressed="false">
                <i data-lucide="table-2"></i><span>表</span>
              </button>
            </div>
          </div>
          <div id="listingList" class="listing-list"></div>
        </section>

        <section id="mapView" class="content-view" aria-label="地図">
          <div class="map-toolbar">
            <label class="check-pill map-toggle">
              <input id="hazardAreaToggle" type="checkbox">
              ハザードエリア
            </label>
            <span id="hazardAreaStatus">API取得後に地図上へ表示できます</span>
          </div>
          <div id="map"></div>
        </section>

        <section id="historyView" class="content-view" aria-label="町別平均">
          <div class="result-meta">
            <span id="townCount">-</span>
            <span>町別の現在件数・平均坪単価</span>
          </div>
          <div class="history-grid" id="historyGrid"></div>
        </section>

        <section id="distributionView" class="content-view" aria-label="坪単価分布">
          <div class="result-meta">
            <span id="distributionSummary">-</span>
            <span>表示中の物件を坪単価帯で集計</span>
          </div>
          <div id="distributionGrid" class="distribution-grid"></div>
        </section>

        <section id="compareView" class="content-view" aria-label="買付候補比較">
          <div class="result-meta">
            <span id="candidateCount">-</span>
            <span>買付候補に追加した物件を横並びで比較</span>
          </div>
          <div id="compareTable" class="compare-wrap"></div>
        </section>
      </main>
    </div>

    <aside id="detailPanel" class="detail-panel" aria-label="物件詳細" aria-hidden="true">
      <div class="detail-head">
        <div>
          <p id="detailTown" class="eyebrow"></p>
          <h2 id="detailTitle"></h2>
        </div>
        <button id="closeDetail" class="icon-button" type="button" aria-label="閉じる">
          <i data-lucide="x"></i>
        </button>
      </div>
      <div id="detailBody" class="detail-body"></div>
    </aside>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
